<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta name="color-scheme" content="dark" />
<meta name="format-detection" content="telephone=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<title>Kabin Harita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --vh:1vh;--vw:1vw;
  --px:max(env(safe-area-inset-left),clamp(18px,calc(3.0*var(--vw)),42px));
  --compass-top:max(env(safe-area-inset-top),2px);
  --compass-h:clamp(24px,calc(4.1*var(--vh)),34px);
  --eq-h:clamp(20px,calc(3.8*var(--vh)),28px);
  --radio-line-h:clamp(18px,calc(3.1*var(--vh)),25px);
  --bg:#000000;
  --card:#11161f;
  --line:rgba(148,197,232,.14);
  --acc:64,196,255;
  --red:rgb(var(--acc));
  --ice:#93ddff;
  --ice-bright:#f2faff;
  --ice-sub:rgba(224,244,255,.86);
  --ice-dim:rgba(176,216,245,.62);
  --amber:#ffb000;
}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{
  width:100vw;height:100vh;height:100dvh;overflow:hidden;background:#000;color:var(--ice-bright);
  touch-action:manipulation;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;
  font-family:'Montserrat',-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;
  font-feature-settings:'tnum' 1;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:geometricPrecision
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

.screen{position:relative;width:100%;height:100%;overflow:hidden;background:#000;backface-visibility:hidden;-webkit-backface-visibility:hidden}

/* HARİTA KATMANI */
.map-stage{
  position:absolute;inset:0;
  z-index:1;cursor:pointer
}
.road-cv,.fx-cv,.compass-cv,.eq-cv{
  width:100%;height:100%;display:block;
  image-rendering:-webkit-optimize-contrast;
  image-rendering:crisp-edges
}
.road-cv{position:absolute;inset:0}
.fx-cv{position:absolute;inset:0;pointer-events:none;z-index:2}

/* EN ÜST: PUSULA ŞERİDİ (EN SOLDAN EN SAĞA) */
.top-compass{
  position:absolute;left:0;right:0;top:var(--compass-top);
  height:var(--compass-h);z-index:7;pointer-events:none;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 4%,#000 96%,transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0%,#000 4%,#000 96%,transparent 100%)
}

/* SOL ÜST: SAAT + DERECE EN SOLA DAYALI, KARTSIZ */
.top-left-hud{
  position:absolute;left:0;top:calc(var(--compass-top) + var(--compass-h) + clamp(8px,calc(1.4*var(--vh)),16px));
  z-index:6;display:flex;flex-direction:column;align-items:flex-start;gap:clamp(3px,calc(.65*var(--vh)),7px);
  padding-left:2px
}
.mini-clock{
  font-size:calc(clamp(18px,calc(3.3*var(--vh)),26px) * 1.10);
  font-weight:700;letter-spacing:.04em;line-height:1;
  color:var(--clk,var(--ice-bright));cursor:pointer;font-variant-numeric:tabular-nums;
  text-shadow:0 0 14px rgba(var(--acc),.48), 0 1px 8px rgba(0,0,0,.95)
}
.mini-temp{
  display:inline-flex;align-items:baseline;gap:2px;
  font-size:calc(clamp(13px,calc(2.25*var(--vh)),17.5px) * 1.21);
  font-weight:600;letter-spacing:.03em;line-height:1.15;
  color:var(--ice-sub);font-variant-numeric:tabular-nums;
  text-shadow:0 1px 8px rgba(0,0,0,.95)
}
.mini-temp sup{font-size:.7em;font-weight:500;color:var(--ice-dim)}
.grade-pill{
  display:none;align-items:center;gap:5px;margin-top:2px;
  padding:2px 4px;background:transparent;pointer-events:none;
  font-size:clamp(9.5px,calc(1.55*var(--vh)),12px);font-weight:600;letter-spacing:.14em;
  color:var(--ice);font-variant-numeric:tabular-nums;
  text-shadow:0 1px 8px rgba(0,0,0,.95)
}
.grade-pill.on{display:inline-flex}

/* SAĞ ÜST: YÖNLENDİRME OKU & MESAFE EN SAĞA DAYALI, KARTSIZ */
.top-right-hud{
  position:absolute;right:0;top:calc(var(--compass-top) + var(--compass-h) + clamp(8px,calc(1.4*var(--vh)),16px));
  z-index:6;display:flex;flex-direction:column;align-items:flex-end;pointer-events:none;
  padding-right:2px
}
.nav-hud{
  display:none;align-items:center;gap:clamp(6px,calc(1.1*var(--vw)),12px);
  padding:2px 0;background:transparent;
  pointer-events:auto;cursor:pointer;transition:opacity .25s,transform .15s
}
.nav-hud:active{transform:scale(.95)}
.nav-hud.on{display:inline-flex}
.nav-ico{
  width:clamp(22px,calc(4.2*var(--vh)),32px);height:clamp(22px,calc(4.2*var(--vh)),32px);
  color:rgb(var(--acc));display:flex;align-items:center;justify-content:center;flex-shrink:0;
  filter:drop-shadow(0 0 10px rgba(var(--acc),.65))
}
.nav-ico svg{width:100%;height:100%}
.nav-dist{
  font-size:clamp(14px,calc(2.6*var(--vh)),20px);font-weight:600;letter-spacing:.08em;
  color:var(--ice-bright);font-variant-numeric:tabular-nums;white-space:nowrap;
  text-shadow:0 0 12px rgba(var(--acc),.35), 0 1px 8px rgba(0,0,0,.95)
}

/* ÜST ORTA: YAKLAŞAN HAVA / YOL UYARISI (KARTSIZ) */
.ahead-chip{
  position:absolute;left:50%;top:calc(var(--compass-top) + var(--compass-h) + clamp(8px,calc(1.4*var(--vh)),16px));
  transform:translateX(-50%) translateY(-6px);z-index:6;
  display:flex;align-items:center;gap:8px;padding:4px 8px;background:transparent;
  color:#ffd275;text-shadow:0 0 12px rgba(255,176,0,.45), 0 1px 8px rgba(0,0,0,.95);
  font-size:clamp(9px,calc(1.5*var(--vh)),11.5px);font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .5s,transform .5s
}
.ahead-chip.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* EKOLAYZIRIN HEMEN ÜSTÜ: TEK SATIR RADYO */
.radio-strip{
  position:absolute;left:var(--px);right:var(--px);
  bottom:calc(max(env(safe-area-inset-bottom),2px) + var(--eq-h) + clamp(1px,calc(.2*var(--vh)),3px));
  height:var(--radio-line-h);z-index:8;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  pointer-events:auto;background:transparent
}
.rs-main{
  display:flex;align-items:baseline;gap:0;min-width:0;flex:1;
  font-size:clamp(11px,calc(1.95*var(--vh)),15.5px);letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 1px 8px rgba(0,0,0,.95)
}
.rs-track{font-weight:600;color:#e6f6ff;cursor:pointer;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.rs-track.paused{color:rgba(210,235,250,.55)}
.rs-sep{font-weight:400;color:rgba(176,216,245,.52);margin:0 7px;flex-shrink:0}
.rs-station{
  font-weight:500;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(186,225,250,.72);cursor:pointer;flex-shrink:0
}
.rs-station:hover{color:#ffffff}
.rs-controls{display:flex;align-items:center;gap:6px;flex-shrink:0;opacity:.75;transition:opacity .2s}
.radio-strip:hover .rs-controls{opacity:1}
.rs-btn{
  font-size:clamp(9.5px,calc(1.45*var(--vh)),11.5px);font-weight:600;
  color:var(--ice-dim);padding:2px 4px;line-height:1;transition:color .15s
}
.rs-btn:active,.rs-btn.active{color:var(--play,#ff8547)}

/* ALT ORTA: ŞEHİR İMZASI + ROTA ÖZETİ (KARTSIZ · SADECE YAZI) */
.sig-wrap{
  position:absolute;left:50%;
  bottom:calc(max(env(safe-area-inset-bottom),2px) + var(--eq-h) + var(--radio-line-h) + clamp(4px,calc(.7*var(--vh)),10px));
  transform:translateX(-50%);z-index:6;
  display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:4px 18px;cursor:pointer;max-width:88vw;
  background:transparent
}
.sig-wrap::before{
  content:'';position:absolute;inset:-18px -46px;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse at center,rgba(0,0,0,.50) 0%,rgba(0,0,0,.28) 42%,rgba(0,0,0,0) 72%)
}
.sig-city{
  font-size:clamp(16px,calc(3.0*var(--vh)),25px);font-weight:600;letter-spacing:.30em;
  text-transform:uppercase;color:#ffffff;
  text-shadow:
    0 0 1.5px rgba(0,0,0,.95),
    0 1px 6px rgba(0,0,0,.92),
    0 0 14px rgba(0,0,0,.72),
    0 0 28px rgba(var(--acc),.46);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:82vw;
  transition:color .2s
}
.sig-wrap:active .sig-city{color:#bae6fd}
.sig-sub{
  margin-top:clamp(2px,calc(.55*var(--vh)),5px);
  font-size:clamp(8.5px,calc(1.35*var(--vh)),10.5px);font-weight:500;letter-spacing:.24em;
  text-transform:uppercase;color:rgba(238,249,255,.96);
  text-shadow:
    0 1px 4px rgba(0,0,0,.96),
    0 0 12px rgba(0,0,0,.80),
    0 0 20px rgba(var(--acc),.34);
  white-space:nowrap
}
.sig-route{
  display:none;margin-top:clamp(4px,calc(.8*var(--vh)),7px);
  font-size:clamp(9px,calc(1.5*var(--vh)),11.5px);font-weight:600;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ice-bright);font-variant-numeric:tabular-nums;white-space:nowrap;
  text-shadow:
    0 1px 4px rgba(0,0,0,.96),
    0 0 12px rgba(0,0,0,.80),
    0 0 22px rgba(var(--acc),.44)
}
.sig-route.on{display:block}

/* EN ALT: DİKEY ÇUBUK EKOLAYZIR (PUSULA GİBİ EN SAĞDAN EN SOLA) */
.bottom-eq{
  position:absolute;left:0;right:0;
  bottom:max(env(safe-area-inset-bottom),2px);
  height:var(--eq-h);z-index:7;pointer-events:none;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 3%,#000 97%,transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0%,#000 3%,#000 97%,transparent 100%)
}

/* MOLA MODU */
.map-stage,.top-left-hud,.top-compass,.sig-wrap{transition:opacity 1s}
.screen.rest .map-stage,.screen.rest .top-left-hud,.screen.rest .top-compass,.screen.rest .sig-wrap{opacity:0;pointer-events:none}
#restBox{
  position:fixed;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;cursor:pointer;background:rgba(0,0,0,.55)
}
.screen.rest #restBox{display:flex}
.rest-clock{font-size:clamp(54px,calc(22*var(--vh)),150px);font-weight:300;letter-spacing:-.04em;line-height:1;color:var(--clk,#fff)}
.rest-date{font-size:clamp(10px,calc(2*var(--vh)),15px);letter-spacing:.26em;text-transform:uppercase;color:var(--ice-sub)}

/* BİLDİRİM TOAST */
.toast{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;
  background:rgba(6,13,24,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(125,211,252,.22);color:var(--ice-bright);
  padding:8px 18px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.18em;
  text-transform:uppercase;opacity:0;pointer-events:none;transition:opacity .28s
}
.toast.on{opacity:1}

/* MODALLAR */
.modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.panel{width:100%;max-width:410px;max-height:92%;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.search{width:100%;padding:11px 13px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ice-bright);font-size:13.5px;outline:none}
.search:focus{border-color:rgba(125,211,252,.55)}
.res{display:flex;flex-direction:column;gap:6px;max-height:210px;overflow-y:auto}
.opt{padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.04);font-size:13px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.opt:active,.opt.cur{background:rgba(125,211,252,.18);border:1px solid rgba(125,211,252,.35)}
.opt-top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:600;color:var(--ice-bright)}
.opt-dist{font-size:11px;font-weight:600;color:var(--ice);flex-shrink:0}
.opt-sub{font-size:11px;color:var(--ice-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-ice{border:1px solid rgba(125,211,252,.45);color:var(--ice);padding:5px 12px;border-radius:9px;font-size:11.5px;font-weight:600;letter-spacing:.06em}
.btn-dim{border:1px solid var(--line);color:var(--ice-sub);padding:5px 12px;border-radius:9px;font-size:11.5px}
#dimLayer{position:fixed;inset:0;z-index:25;background:#000;opacity:0;pointer-events:none;transition:opacity 1.2s}
</style>
</head>
<body>

<div class="screen" id="screen">
  <div class="map-stage" id="mapStage">
    <canvas class="road-cv" id="roadCanvas"></canvas>
  </div>
  <canvas class="fx-cv" id="fxCanvas"></canvas>

  <!-- EN ÜST: PUSULA ŞERİDİ -->
  <div class="top-compass">
    <canvas class="compass-cv" id="compassCanvas"></canvas>
  </div>

  <!-- SOL ÜST: SAAT + DERECE EN SOLA DAYALI -->
  <div class="top-left-hud">
    <div class="mini-clock" id="miniClock">--:--</div>
    <div class="mini-temp"><b id="miniTemp">--</b><sup>°C</sup></div>
    <div class="grade-pill" id="gradePill">
      <span id="gradeText">%0</span>
    </div>
  </div>

  <!-- SAĞ ÜST: YÖNLENDİRME OKU & MESAFE EN SAĞA DAYALI (iptal için çift dokun) -->
  <div class="top-right-hud">
    <div class="nav-hud" id="navHud" onclick="hudTap()">
      <div class="nav-ico" id="navIcon"></div>
      <span class="nav-dist" id="navTurnDist">--</span>
    </div>
  </div>

  <!-- ÜST ORTA: YAKLAŞAN HAVA / YOL UYARISI -->
  <div class="ahead-chip" id="aheadChip">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ffb000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 22 20H2z"/><path d="M12 10v4.5M12 17.5v.1"/></svg>
    <span id="aheadText"></span>
  </div>

  <!-- EKOLAYZIRIN HEMEN ÜSTÜ: TEK SATIR RADYO -->
  <div class="radio-strip" id="radioStrip">
    <div class="rs-main">
      <span class="rs-track paused" id="rsTrack" onclick="toggleRadio()">StockXL - Lunar Radio (Spacesynth 80)</span>
      <span class="rs-sep">-</span>
      <span class="rs-station" id="rsStation" onclick="openRadioModal()">NIGHTRIDE FM</span>
    </div>
    <div class="rs-controls">
      <button class="rs-btn" id="rsPlayBtn" onclick="toggleRadio()" title="Oynat / Durdur">▶</button>
      <button class="rs-btn" onclick="prevStation()" title="Önceki kanal">◀</button>
      <button class="rs-btn" onclick="nextStation()" title="Sonraki kanal">▶</button>
      <button class="rs-btn" onclick="openRadioModal()" title="Kanallar">≡</button>
    </div>
  </div>

  <!-- ALT ORTA: ŞEHİR İMZASI + ROTA ÖZETİ -->
  <div class="sig-wrap" id="sigBox" onclick="openNav()">
    <div class="sig-city" id="sigCity">KONUM ALINIYOR</div>
    <div class="sig-sub" id="sigSub">TÜRKİYE</div>
    <div class="sig-route" id="sigRoute">--</div>
  </div>

  <!-- EN ALT: DİKEY ÇUBUK EKOLAYZIR (EN SAĞDAN EN SOLA) -->
  <div class="bottom-eq">
    <canvas class="eq-cv" id="eqCanvas"></canvas>
  </div>

  <div id="restBox" onclick="exitRest(true)">
    <div class="rest-clock" id="restClock">--:--</div>
    <div class="rest-date" id="restDate"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>
<div id="dimLayer"></div>

<!-- RADYO KANAL SEÇİCİ MODALI -->
<div class="modal" id="radioModal" onclick="closeRadioModal()">
  <div class="panel" onclick="event.stopPropagation()">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <strong style="font-size:13.5px;font-weight:600;letter-spacing:.08em;color:var(--ice-bright)">RADYO İSTASYONLARI</strong>
      <button class="btn-dim" onclick="closeRadioModal()">Kapat</button>
    </div>
    <div class="res" id="stationList" style="max-height:310px"></div>
  </div>
</div>

<!-- ROTA ARAMA & ÇEVRİMDIŞI HARİTA MODALI -->
<div class="modal" id="navModal" onclick="closeNav()">
  <div class="panel" onclick="event.stopPropagation()">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <strong style="font-size:13.5px;font-weight:600;letter-spacing:.06em;color:var(--ice-bright)">HEDEF & HARİTA</strong>
      <div style="display:flex;gap:6px">
        <button id="navCancelModalBtn" class="btn-ice" onclick="cancelNav(true);closeNav()" style="display:none">Rotayı iptal et</button>
        <button class="btn-dim" onclick="toggleRotMode()">Ekran yönü</button>
      </div>
    </div>
    <input id="navInput" class="search" placeholder="Adres, cadde, ilçe veya şehir yazın…" />
    <div id="navHint" style="font-size:11px;color:var(--ice-sub)">Bulunduğun konumdan araç rotası çizilir</div>
    <div class="res" id="navRes"></div>

    <div style="border-top:1px solid var(--line);padding-top:11px;display:flex;flex-direction:column;gap:7px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <strong style="font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--ice-bright)">ÇEVRİMDIŞI HARİTA</strong>
        <span id="dlInfo" style="font-size:10.5px;color:var(--ice-dim)"></span>
      </div>
      <div id="dlText" style="font-size:11.5px;color:var(--ice-sub)">İzmir · Aydın · Muğla ana yollar, demiryolu, nehir ve kıyı</div>
      <div style="height:2px;background:rgba(125,211,252,.12);border-radius:2px;overflow:hidden"><i id="dlBar" style="display:block;height:100%;width:0;background:var(--ice)"></i></div>
      <div style="display:flex;gap:8px;margin-top:2px">
        <button id="dlBtn" class="btn-ice" onclick="toggleDownload()">İndir</button>
        <button class="btn-dim" onclick="clearOffline()">Sil</button>
      </div>
    </div>
  </div>
</div>

<audio id="radioAudio" preload="none"></audio>
<script>
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DPR = Math.min(4, Math.max(2, window.devicePixelRatio || 1));
const FDPR = Math.min(3, Math.max(1.5, window.devicePixelRatio || 1));
const M_LAT = 110540;
const DAYS = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
const MONTHS = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];

function toast(t){
  const el = $('toast');
  el.textContent = t;
  el.classList.add('on');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.classList.remove('on'), 1600);
}

/* ---------- RENK TEMALARI (SAAT, PUSULA, EKOLAYZIR & YOL) ---------- */
const THEMES = {
  red:   { n:'Kırmızı',    acc:[229,72,77],   core:[255,120,105], far:[200,50,90],   arrow:[240,138,69], play:[217,119,36], clk:[255,155,155] },
  amber: { n:'Kehribar',   acc:[255,176,0],   core:[255,210,105], far:[255,130,0],   arrow:[255,176,0],  play:[255,176,0],  clk:[255,204,92] },
  ice:   { n:'Buz mavisi', acc:[64,196,255],  core:[150,225,255], far:[60,140,255],  arrow:[95,208,255], play:[76,195,255], clk:[191,234,255] },
  green: { n:'Neon yeşil', acc:[57,255,120],  core:[150,255,185], far:[20,200,160],  arrow:[57,255,120], play:[57,255,120], clk:[168,255,198] },
  synth: { n:'Synthwave',  acc:[255,60,200],  core:[255,145,232], far:[150,90,255],  arrow:[255,79,216], play:[182,107,255],clk:[255,155,236] },

const THEME_KEYS = ['acc', 'core', 'far', 'arrow', 'play', 'clk'];

let themeKey = 'ice';
try{ const sv = localStorage.getItem('theme'); if (sv && THEME_ORDER.includes(sv)) themeKey = sv; }catch{}

function applyThemeColors(c){
  const r = a => a.map(v => Math.round(v)).join(',');

  root.setProperty('--acc', r(c.acc));
  root.setProperty('--play', 'rgb(' + r(c.play) + ')');
  root.setProperty('--clk', 'rgb(' + r(c.clk) + ')');
  TH.acc = r(c.acc); TH.core = r(c.core); TH.far = r(c.far); TH.arrow = r(c.arrow); TH.clk = r(c.clk);
  TH.accA = c.acc.slice(); TH.coreA = c.core.slice(); TH.farA = c.far.slice();

function resolveTheme(){
  if (themeKey !== 'auto') return { t: THEMES[themeKey], night: false, label: THEMES[themeKey].n };
  const d = new Date(), h = d.getHours() + d.getMinutes() / 60;
  if (h >= 6.5 && h < 17.5) return { t: THEMES.ice, night: false, label: 'Buz mavisi' };
  if (h >= 17.5 && h < 20.5) return { t: THEMES.amber, night: false, label: 'Kehribar' };
  return { t: THEMES.amber, night: true, label: 'Kehribar' };
}
function setTheme(key, announce, instant){
  themeKey = key;
  try{ localStorage.setItem('theme', key); }catch{}
  const r = resolveTheme();
  $('dimLayer').style.opacity = r.night ? '0.20' : '0';
  const target = r.t;
  cancelAnimationFrame(tweenRaf);
  if (instant){ curTheme = cloneTheme(target); applyThemeColors(curTheme); }
  else {
    const from = cloneTheme(curTheme), t0 = performance.now();
    const step = () => {
      const k = Math.min(1, (performance.now() - t0) / 650);
      const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      THEME_KEYS.forEach(n => { curTheme[n] = from[n].map((v, i) => v + (target[n][i] - v) * e); });
      applyThemeColors(curTheme);
      if (k < 1) tweenRaf = requestAnimationFrame(step);
    };
    tweenRaf = requestAnimationFrame(step);
  }
  if (announce) toast('Renk: ' + (key === 'auto' ? 'Otomatik (' + r.label + ')' : THEMES[key].n));
}

/* ---------- ARKA PLAN EFEKTLERİ (MOLA GÖKYÜZÜ & HIZ ÇİZGİLERİ) ---------- */
const fxCv = $('fxCanvas'), fxCtx = fxCv.getContext('2d', { alpha: true });
let fxCur = {}, fxSig = '', fxL = { stars: [], streaks: [] }, fxRaf = 0, fxLast = 0, speedLvl = 0, speedFlag = false;
const fxT0 = performance.now();

function fxSize(){
  fxCv.width = Math.max(1, Math.round(fxCv.clientWidth * FDPR));
  fxCv.height = Math.max(1, Math.round(fxCv.clientHeight * FDPR));
  fxBuild(); fxKick();
}
function computeFx(){
  const f = {};
  if (restMode){ f.stars = { n: 120 }; f.aurora = true; }
  return f;
}
function setFxState(){
  const f = computeFx(), sig = JSON.stringify(f);
  if (sig !== fxSig){ fxSig = sig; fxCur = f; fxBuild(); }
  fxKick();
}
function newStreak(init){
  const w = fxCv.width, side = Math.random() < 0.5 ? -1 : 1, ang = -0.6 + Math.random() * 1.5;
  return { dx: side * Math.cos(ang), dy: Math.sin(ang), r: (init ? 0.15 + Math.random() * 0.6 : 0.15 + Math.random() * 0.1) * w,
    v: (170 + Math.random() * 230) * FDPR, len: (30 + Math.random() * 60) * FDPR, a: 0.10 + Math.random() * 0.14 };
}
function fxBuild(){
  const w = fxCv.width, h = fxCv.height, dp = FDPR, f = fxCur;
  fxL = { stars: [], streaks: [] };
  fxCtx.clearRect(0, 0, w, h);
  if (f.stars){
    for (let i = 0; i < f.stars.n; i++){
      const vx = (1 + Math.random() * 3) * dp;
      fxL.stars.push({ x: Math.random() * w, y: Math.random() * h, r: (0.45 + Math.random() * 0.9) * dp, a: 0.25 + Math.random() * 0.35,
        ph: Math.random() * 6.28, sp: 0.5 + Math.random() * 1.5, vx, vy: vx * 0.3 });
    }
  }
  for (let i = 0; i < 26; i++) fxL.streaks.push(newStreak(true));
}
function fxHasLayers(){ return !!(fxCur.stars || fxCur.aurora); }
function fxSpeedWanted(){
  const fresh = Date.now() - fixTime < 6000;
  if (fixSpeed >= 22.2 && fresh) speedFlag = true; else if (fixSpeed < 19 || !fresh) speedFlag = false;
  return speedFlag;
}
function fxKick(){
  if (fxRaf || document.hidden) return;
  if (fxHasLayers() || speedLvl > 0.01 || fxSpeedWanted()) fxRaf = requestAnimationFrame(fxFrame);
}
function fxFrame(ts){
  fxRaf = 0;
  if (document.hidden) return;
  if (fxLast && ts - fxLast < 33){ fxRaf = requestAnimationFrame(fxFrame); return; }
  const dt = fxLast ? Math.min(0.1, (ts - fxLast) / 1000) : 0.033;
  fxLast = ts;
  const w = fxCv.width, h = fxCv.height, dp = FDPR, f = fxCur;
  const t = (performance.now() - fxT0) / 1000;
  speedLvl += ((fxSpeedWanted() ? 1 : 0) - speedLvl) * Math.min(1, dt * 0.9);
  if (!fxHasLayers() && speedLvl < 0.01){ fxCtx.clearRect(0, 0, w, h); fxLast = 0; return; }
  fxCtx.clearRect(0, 0, w, h);
  if (f.aurora){
    const g = fxCtx.createLinearGradient(0, h * 0.1, 0, h * 0.55);
    g.addColorStop(0, `rgba(${TH.acc},0)`); g.addColorStop(0.5, `rgba(${TH.acc},0.10)`); g.addColorStop(1, `rgba(${TH.acc},0)`);
    fxCtx.fillStyle = g; fxCtx.fillRect(0, h * 0.1, w, h * 0.45);
  }
  if (f.stars){
    for (const s of fxL.stars){
      s.x += s.vx * dt; s.y += s.vy * dt;
      if (s.x > w + 2) s.x = -2; if (s.y > h + 2) s.y = -2;
      fxCtx.fillStyle = `rgba(255,255,255,${(s.a * (0.55 + 0.45 * Math.sin(t * s.sp + s.ph))).toFixed(3)})`;
      fxCtx.beginPath(); fxCtx.arc(s.x, s.y, s.r, 0, 6.2832); fxCtx.fill();
    }
  }
  if (speedLvl > 0.01){
    const cx = w * 0.5, cy = h * 0.48, maxR = Math.hypot(w, h) * 0.55;
    fxCtx.lineCap = 'round'; fxCtx.lineWidth = 1.0 * dp;
    for (const s of fxL.streaks){
      s.r += s.v * dt;
      const x1 = cx + s.dx * s.r, y1 = cy + s.dy * s.r;
      if (x1 < -40 || x1 > w + 40 || y1 > h + 40 || y1 < -40 || s.r > maxR * 1.3){ Object.assign(s, newStreak(false)); continue; }
      const len = s.len * (0.4 + s.r / maxR), fadeIn = Math.min(1, Math.max(0, (s.r - 0.18 * w) / (0.3 * w)));
      fxCtx.strokeStyle = `rgba(${TH.core},${(s.a * speedLvl * fadeIn).toFixed(3)})`;
      fxCtx.beginPath(); fxCtx.moveTo(x1, y1); fxCtx.lineTo(x1 + s.dx * len, y1 + s.dy * len); fxCtx.stroke();
    }
  }
  fxRaf = requestAnimationFrame(fxFrame);
}

/* ---------- EKOLAYZIR (TAM GENİŞLİK · 160 ÇUBUK) ---------- */
const eqCv = $('eqCanvas'), ectx = eqCv.getContext('2d', { alpha: true }), NB = 160, bars = new Float32Array(NB);
let eqRaf = null, eqLast = 0;
const EQ_MAX = 0.72;

function eqSize(){
  eqCv.width = Math.max(1, Math.round(eqCv.clientWidth * DPR));
  eqCv.height = Math.max(1, Math.round(eqCv.clientHeight * DPR));
  eqKick();
}

function eqFrame(ts){
  if (eqLast && ts - eqLast < 28){ eqRaf = requestAnimationFrame(eqFrame); return; }
  eqLast = ts;
  const w = eqCv.width, h = eqCv.height, t = ts / 1000;
  const bw = Math.max(1, Math.round(Math.max(1.2 * DPR, (w / NB) * 0.34))), step = (w - bw) / (NB - 1);
  let mx = 0;
  ectx.clearRect(0, 0, w, h);
  ectx.lineCap = 'butt';
  ectx.lineWidth = bw;
  for (let i = 0; i < NB; i++){
    const c = i / (NB - 1);
    const leftBias = 0.14 + 0.86 * Math.exp(-Math.pow((c - 0.26) / 0.24, 2)) + 0.35 * Math.exp(-Math.pow((c - 0.05) / 0.07, 2));
    const w1 = Math.abs(Math.sin(t * 2.1 + i * 0.34));
    const w2 = Math.abs(Math.sin(t * 1.35 - i * 0.14 + 1.1));
    const w3 = 0.5 + 0.5 * Math.sin(t * 3.7 + i * 0.78);
    const tg = radioPlaying ? Math.min(1, (0.08 + 0.92 * (w1 * w2 * 0.75 + w3 * 0.25)) * leftBias) * EQ_MAX : 0;
    bars[i] += (tg - bars[i]) * (tg > bars[i] ? 0.42 : 0.14);
    mx = Math.max(mx, bars[i]);
    const bh = Math.round(Math.max(2 * DPR, bars[i] * (h - 2 * DPR)));
    const x = Math.round(i * step) + bw / 2;
    ectx.strokeStyle = bars[i] < 0.08 ? `rgba(${TH.acc},.52)` : `rgba(${TH.core},.96)`;
    ectx.beginPath();
    ectx.moveTo(x, h);
    ectx.lineTo(x, h - bh);
    ectx.stroke();
  }
  eqRaf = (radioPlaying || mx > 0.01) ? requestAnimationFrame(eqFrame) : null;
}
function eqKick(){ if (!eqRaf) eqRaf = requestAnimationFrame(eqFrame); }

    } else if (st.metaType === 'nightride'){

/* ---------- ÜST PUSULA ŞERİDİ ---------- */
const compCv = $('compassCanvas'), cctx = compCv.getContext('2d', { alpha: true });
const CARDINAL_MAP = { 0: 'N', 90: 'E', 180: 'S', 270: 'W' };
const INTER_MAP = { 45: 'NE', 135: 'SE', 225: 'SW', 315: 'NW' };
const WIND8 = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
let smoothCompassHead = 0;

function compassSize(){
  compCv.width = Math.max(1, Math.round(compCv.clientWidth * DPR));
  compCv.height = Math.max(1, Math.round(compCv.clientHeight * DPR));
  drawTopCompass();
}

function drawTopCompass(){
  const w = compCv.width, h = compCv.height;
  if (!w || !h) return;
  const dp = DPR;
  cctx.clearRect(0, 0, w, h);

  const cx = w * 0.5;
  const pxPerDeg = Math.max(3.1 * dp, w / 195);
  const halfSpanDeg = Math.ceil((w * 0.5) / pxPerDeg) + 12;
  const centerDeg = smoothCompassHead;
  const startDeg = Math.floor((centerDeg - halfSpanDeg) / 5) * 5;
  const endDeg = Math.ceil((centerDeg + halfSpanDeg) / 5) * 5;

  const topFontPx = Math.round(Math.max(8.5 * dp, h * 0.34));
  const botFontPx = Math.round(Math.max(6.8 * dp, h * 0.25));
  const tickTopBase = Math.round(topFontPx + 2.5 * dp);
  const tickBotBase = Math.round(h - botFontPx - 2.2 * dp);
  const skipPx = Math.max(topFontPx * 1.9, botFontPx * 3.4);

  cctx.lineCap = 'butt';
  cctx.textAlign = 'center';

  for (let d = startDeg; d <= endDeg; d += 5){
    const norm = ((d % 360) + 360) % 360;
    const x = Math.round(cx + (d - centerDeg) * pxPerDeg) + 0.5;
    if (x < -28 * dp || x > w + 28 * dp) continue;

    const isCard = norm in CARDINAL_MAP;
    const isInter = norm in INTER_MAP;
    const is15 = norm % 15 === 0;
    const nearCenter = Math.abs(x - cx) < skipPx;

    const tTop = (isCard || is15) ? tickTopBase : Math.round(tickTopBase + 1.8 * dp);
    const tBot = (isCard || is15) ? tickBotBase : Math.round(tickBotBase - 1.2 * dp);
    cctx.strokeStyle = isCard ? `rgba(${TH.acc}, 0.90)` : (is15 ? `rgba(${TH.clk}, 0.62)` : `rgba(${TH.clk}, 0.34)`);
    cctx.lineWidth = Math.max(1, Math.round((isCard ? 1.25 : (is15 ? 1.0 : 0.8)) * dp));
    cctx.beginPath(); cctx.moveTo(x, tTop); cctx.lineTo(x, tBot); cctx.stroke();

    if (nearCenter) continue;

    if (isCard){
      cctx.font = `700 ${topFontPx}px 'Montserrat', sans-serif`;
      cctx.textBaseline = 'top';
      cctx.fillStyle = `rgb(${TH.acc})`;
      cctx.fillText(CARDINAL_MAP[norm], x, 0.5 * dp);
    }

    cctx.font = `600 ${botFontPx}px 'Montserrat', sans-serif`;
    cctx.textBaseline = 'bottom';
    if (isCard){ cctx.fillStyle = `rgba(${TH.acc}, 0.94)`; cctx.fillText(`${norm}°`, x, h - 0.5 * dp); }
    else if (isInter){ cctx.fillStyle = `rgba(${TH.acc}, 0.88)`; cctx.fillText(INTER_MAP[norm], x, h - 0.5 * dp); }
    else if (norm % 30 === 0){ cctx.fillStyle = `rgba(${TH.acc}, 0.78)`; cctx.fillText(`${norm}°`, x, h - 0.5 * dp); }
  }

  const hd = ((Math.round(centerDeg) % 360) + 360) % 360;
  const cLineX = Math.round(cx) + 0.5;
  cctx.strokeStyle = `rgb(${TH.acc})`;
  cctx.lineWidth = Math.max(2, Math.round(1.4 * dp));
  cctx.beginPath(); cctx.moveTo(cLineX, tickTopBase); cctx.lineTo(cLineX, tickBotBase); cctx.stroke();

  cctx.fillStyle = `rgb(${TH.core})`;
  cctx.font = `700 ${topFontPx}px 'Montserrat', sans-serif`;
  cctx.textBaseline = 'top';
  cctx.fillText(WIND8[Math.round(hd / 45) % 8], cLineX, 0.5 * dp);
  cctx.font = `700 ${botFontPx}px 'Montserrat', sans-serif`;
  cctx.textBaseline = 'bottom';
  cctx.fillText(`${hd}°`, cLineX, h - 0.5 * dp);
}

function computeAutoZoomMeters(speedMs, distToNextTurn){
  const kmh = (speedMs || 0) * 3.6;

/* Zoom büyüdükçe daha geniş alanın yolları çekilir: 0 = yakın, 1 = orta, 2 = geniş */
function roadLevelFor(z){ return z >= 2000 ? 2 : (z >= 900 ? 1 : 0); }

let slopeRefLat = null, slopeRefLon = null, slopeRefAlt = null, smoothGrade = 0;
function updateSlope(lat, lon, alt){
  if (alt == null || !isFinite(alt)) return;
  if (slopeRefLat === null){ slopeRefLat = lat; slopeRefLon = lon; slopeRefAlt = alt; return; }
  const dMeters = distKm(slopeRefLat, slopeRefLon, lat, lon) * 1000;
  if (dMeters >= 38){
    const rawPct = Math.max(-25, Math.min(25, ((alt - slopeRefAlt) / dMeters) * 100));
    smoothGrade = smoothGrade * 0.55 + rawPct * 0.45;
    slopeRefLat = lat; slopeRefLon = lon; slopeRefAlt = alt;
    const pill = $('gradePill');
    if (Math.abs(smoothGrade) >= 3){

}

function kickRoadAnim(){ if (!roadAnimRaf) roadAnimRaf = requestAnimationFrame(stepRoadAnim); }
function stepRoadAnim(ts){
  roadAnimRaf = null;
  if (targetLat === null || targetLon === null) return;
  let tl = targetLat, tn = targetLon;
  const age = (Date.now() - fixTime) / 1000;
  const driving = fixLat !== null && fixSpeed > 0.8 && age < 6;
  if (driving){
    const a = Math.min(age, 3), hr = fixHead * Math.PI / 180;
    tl = fixLat + fixSpeed * a * Math.cos(hr) / M_LAT;
    tn = fixLon + fixSpeed * a * Math.sin(hr) / (111320 * Math.cos(tl * Math.PI / 180));
  }
  if (renderLat === null){
    renderLat = tl; renderLon = tn; renderHeading = targetHeading;
    smoothCompassHead = targetHeading; renderZoomMeters = targetZoomMeters;
    lastStepTs = ts || 0; drawRoadMap(); drawTopCompass();
    if (driving) kickRoadAnim();
    return;
  }
  const dt = lastStepTs ? Math.min(0.1, Math.max(0.001, (ts - lastStepTs) / 1000)) : 0.016;
  lastStepTs = ts || 0;
  const k = 1 - Math.exp(-dt * 9), kh = 1 - Math.exp(-dt * 7), kz = 1 - Math.exp(-dt * 3.2);
  const dLat = tl - renderLat, dLon = tn - renderLon;
  const dHead = ((targetHeading - renderHeading + 540) % 360) - 180;
  const dComp = ((targetHeading - smoothCompassHead + 540) % 360) - 180;
  const dZoom = targetZoomMeters - renderZoomMeters;
  const arrowPulsing = (Date.now() - arrowTapAt) < 460;
  const settled = Math.abs(dLat) < 1e-7 && Math.abs(dLon) < 1e-7 && Math.abs(dHead) < 0.25 && Math.abs(dComp) < 0.25 && Math.abs(dZoom) < 0.5 && !arrowPulsing;
  if (settled){
    renderLat = tl; renderLon = tn; renderHeading = targetHeading;
    smoothCompassHead = targetHeading; renderZoomMeters = targetZoomMeters;
  } else {
    renderLat += dLat * k; renderLon += dLon * k;
    renderHeading = (renderHeading + dHead * kh + 360) % 360;
    smoothCompassHead = (smoothCompassHead + dComp * kh + 360) % 360;
    renderZoomMeters += dZoom * kz;
  }
  drawRoadMap(); drawTopCompass();
  if (driving || !settled) roadAnimRaf = requestAnimationFrame(stepRoadAnim); else lastStepTs = 0;
}

let idbP = null;
function idb(){
  if (idbP) return idbP;
  idbP = new Promise((res, rej) => {
    try{
      const rq = indexedDB.open('kabin-harita', 1);
      rq.onupgradeneeded = () => { const d = rq.result; ['cells', 'live', 'meta'].forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n); }); };
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
    }catch(e){ rej(e); }
  });
  idbP.catch(() => { idbP = null; });
  return idbP;
}
function idbOp(store, mode, fn){
  return idb().then(db => new Promise((res, rej) => {
    const tx = db.transaction(store, mode);
    const rq = fn(tx.objectStore(store));
    tx.oncomplete = () => res(rq && rq.result);
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error);
  }));
}
const idbGet = (s, k) => idbOp(s, 'readonly', o => o.get(k));
const idbPut = (s, k, v) => idbOp(s, 'readwrite', o => o.put(v, k));
const idbDel = (s, k) => idbOp(s, 'readwrite', o => o.delete(k));
const idbKeys = s => idbOp(s, 'readonly', o => o.getAllKeys());
const idbClear = s => idbOp(s, 'readwrite', o => o.clear());

function rawFromElements(els){
  const out = [];
  for (const el of els){
    if (el.type !== 'way' || !Array.isArray(el.geometry) || el.geometry.length < 2) continue;
    const tg = el.tags || {};
    const k = tg.highway ? tg.highway : tg.railway ? 'rail' : tg.waterway ? 'river' : tg.natural === 'coastline' ? 'coast' : null;
    if (!k) continue;
    const pts = []; let a0 = 90, a1 = -90, o0 = 180, o1 = -180;
    for (const g of el.geometry){
      if (!g || g.lat == null) continue;
      pts.push(+g.lat.toFixed(5), +g.lon.toFixed(5));
      if (g.lat < a0) a0 = g.lat; if (g.lat > a1) a1 = g.lat;
      if (g.lon < o0) o0 = g.lon; if (g.lon > o1) o1 = g.lon;
    }
    if (pts.length < 4) continue;
    out.push({ id: el.id, k, ref: tg.ref || '', name: tg.name || '', pts, b: [a0, a1, o0, o1] });
  }
  return out;
}
const CLS = { motorway:0, motorway_link:0, trunk:0, trunk_link:0, primary:1, primary_link:1, secondary:2, secondary_link:2, tertiary:3, tertiary_link:3 };
function toLocal(w, lat, lon, mLon){
  const p = w.pts, m = [];
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (let i = 0; i < p.length; i += 2){
    const x = (p[i+1] - lon) * mLon, y = (p[i] - lat) * M_LAT;
    m.push([x, y]);
    if (x < x0) x0 = x; if (x > x1) x1 = x;
    if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  const k = w.k;
  const cls = k === 'rail' ? 6 : k === 'river' ? 7 : k === 'coast' ? 8 : (k in CLS ? CLS[k] : 4);
  return { id: w.id, hw: k, ref: w.ref, name: w.name, road: cls <= 4, cls, m, bx0: x0, bx1: x1, by0: y0, by1: y1 };
}
function rebuildLocal(lat, lon){
  const cosL = Math.max(0.2, Math.cos(lat * Math.PI / 180)), mLon = 111320 * cosL;
  const R = 0.075, RL = R / cosL;
  const seen = new Set(), out = [];
  const add = arr => {
    for (const w of arr){
      if (seen.has(w.id)) continue;
      const b = w.b;
      if (b[0] > lat + R || b[1] < lat - R || b[2] > lon + RL || b[3] < lon - RL) continue;
      seen.add(w.id);
      out.push(toLocal(w, lat, lon, mLon));
    }
  };
  add(liveRaw);
  for (const a of loadedLive.values()) add(a);
  for (const a of loadedCells.values()) add(a);
  ancLat = lat; ancLon = lon; ancMLon = mLon; roadAnchorSet = true;
  roadWays = out; projectNavRoute(); drawRoadMap();
}

const CELL = 0.25;
let lastCacheLat = null, lastCacheLon = null, cacheBusy = false;
async function loadCaches(lat, lon){
  let changed = false;
  const iy0 = Math.floor(lat / CELL), ix0 = Math.floor(lon / CELL), need = new Set();
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) need.add((iy0 + dy) + '_' + (ix0 + dx));
  for (const k of [...loadedCells.keys()]) if (!need.has(k)){ loadedCells.delete(k); changed = true; }
  for (const k of need){
    if (loadedCells.has(k)) continue;
    try{ const r = await idbGet('cells', k); if (r && r.ways){ loadedCells.set(k, r.ways); changed = true; } }catch{}
  }
  if (liveIndex === null){ try{ liveIndex = (await idbGet('meta', 'liveIndex')) || []; }catch{ liveIndex = []; } }
  const keep = new Set();
  for (const e of liveIndex){
    const [a, b] = e.k.split('_').map(Number);
    if (Math.abs(a - lat) < 0.075 && Math.abs(b - lon) < 0.09){
      keep.add(e.k);
      if (!loadedLive.has(e.k)){ try{ const r = await idbGet('live', e.k); if (r && r.ways){ loadedLive.set(e.k, r.ways); changed = true; } }catch{} }
    }
  }
  for (const k of [...loadedLive.keys()]) if (!keep.has(k)){ loadedLive.delete(k); changed = true; }
  return changed;
}
function ensureLocal(lat, lon){
  if (!roadAnchorSet || distKm(ancLat, ancLon, lat, lon) > 1.8) rebuildLocal(lat, lon);
  if (!cacheBusy && (lastCacheLat === null || distKm(lastCacheLat, lastCacheLon, lat, lon) > 0.7)){
    cacheBusy = true; lastCacheLat = lat; lastCacheLon = lon;
    loadCaches(lat, lon).then(ch => { if (ch) rebuildLocal(targetLat !== null ? targetLat : lat, targetLon !== null ? targetLon : lon); }).catch(() => {}).then(() => { cacheBusy = false; });
  }
}
async function saveLive(lat, lon, raw){
  try{
    const k = lat.toFixed(2) + '_' + lon.toFixed(2);
    await idbPut('live', k, { t: Date.now(), ways: raw });
    if (liveIndex === null) liveIndex = (await idbGet('meta', 'liveIndex')) || [];
    liveIndex = liveIndex.filter(e => e.k !== k);
    liveIndex.push({ k, t: Date.now() });
    while (liveIndex.length > 90){ const old = liveIndex.shift(); await idbDel('live', old.k); loadedLive.delete(old.k); }
    await idbPut('meta', 'liveIndex', liveIndex);
  }catch{}
}

function firstOk(list){
  return new Promise((resolve, reject) => {
    let left = list.length; const errs = [];
    list.forEach(p => p.then(resolve, e => { errs.push(e && e.message ? e.message : String(e)); if (--left === 0) reject(new Error(errs.join(' | '))); }));
  });
}
function overpassQuery(lat, lon, kinds, d, extras){
  const cosLat = Math.max(0.2, Math.cos(lat * Math.PI / 180)), dLon = d / cosLat;
  const box = `${(lat-d).toFixed(5)},${(lon-dLon).toFixed(5)},${(lat+d).toFixed(5)},${(lon+dLon).toFixed(5)}`;
  let body = `way["highway"~"^(${kinds})$"](${box});`;
  if (extras) body += `way["railway"="rail"](${box});way["waterway"="river"](${box});way["natural"="coastline"](${box});`;
  return `[out:json][timeout:22];(${body});out body geom;`;
}
async function overpassGet(q){
  const ctrls = OVERPASS.map(() => new AbortController());
  const killer = setTimeout(() => ctrls.forEach(c => c.abort()), 19000);
  try{
    return await firstOk(OVERPASS.map((ep, i) => fetch(`${ep}?data=${encodeURIComponent(q)}`, { signal: ctrls[i].signal })
      .then(r => { if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
      .then(d => { if (!d || !Array.isArray(d.elements)) throw new Error('bozuk cevap'); if (!d.elements.length && d.remark) throw new Error('sunucu zaman aşımı'); return d; })));
  } finally { clearTimeout(killer); ctrls.forEach(c => c.abort()); }
}
let dlRot = 0;
async function overpassSeq(q, ms){
  const errs = [];
  for (let i = 0; i < OVERPASS.length; i++){
    const ep = OVERPASS[(dlRot + i) % OVERPASS.length];
    const ctrl = new AbortController(); const tm = setTimeout(() => ctrl.abort(), ms);
    try{
      const r = await fetch(`${ep}?data=${encodeURIComponent(q)}`, { signal: ctrl.signal });
      if (!r.ok) throw new Error('http ' + r.status);
      const d = await r.json();
      if (!d || !Array.isArray(d.elements)) throw new Error('bozuk cevap');
      if (!d.elements.length && d.remark) throw new Error('zaman aşımı');
      clearTimeout(tm); dlRot = (dlRot + i) % OVERPASS.length; return d;
    }catch(e){ clearTimeout(tm); errs.push(e && e.message); }
  }
  throw new Error(errs.join(' | '));
}

/* Yol verisi: zoom seviyesine göre yakın / orta / geniş alan çekilir */
const ROAD_TIERS = [
  [[HW_ALL, 0.024, 2.6, true], [HW_MAIN, 0.032, 3.5, true], [HW_MAIN, 0.014, 1.5, false]],
  [[HW_MAIN + '|tertiary|tertiary_link|unclassified', 0.036, 3.6, true], [HW_MAIN, 0.036, 3.6, true], [HW_MAIN, 0.014, 1.5, false]],
  [[HW_MAIN, 0.056, 5.8, true], [HW_MAIN, 0.036, 3.6, false], [HW_MAIN, 0.014, 1.5, false]]
];
async function fetchRoadNetwork(lat, lon, force=false){
  if (lat == null || lon == null) return;
  ensureLocal(lat, lon);
  const now = Date.now(), want = roadLevelFor(targetZoomMeters);
  const moved = roadFetchLat !== null ? distKm(roadFetchLat, roadFetchLon, lat, lon) : 99;
  if (!force && liveRaw.length && want === roadFetchLevel && moved < roadFetchRadiusKm * (want ? 0.35 : 0.45) && now - roadFetchAt < 300000) return;
  if (roadLoading && now - roadLoadStart < 60000) return;
  if (!force && now - roadLastTryAt < 8000) return;
  clearTimeout(roadRetryTimer);
  roadLoading = true; roadLoadStart = now; roadLastTryAt = now;

  try{
    let data = null, radius = 2.6;
    for (const [kinds, d, r, ex] of ROAD_TIERS[want]){
      try{ data = await overpassGet(overpassQuery(lat, lon, kinds, d, ex)); radius = r; break; }catch{}
    }
    if (!data){
      roadRetryTimer = setTimeout(() => { if (targetLat !== null && targetLon !== null) fetchRoadNetwork(targetLat, targetLon, true); }, 15000);
      return;
    }
    const raw = rawFromElements(data.elements);
    liveRaw = raw; roadFetchLat = lat; roadFetchLon = lon; roadFetchAt = Date.now(); roadFetchRadiusKm = radius; roadFetchLevel = want;
    rebuildLocal(targetLat !== null ? targetLat : lat, targetLon !== null ? targetLon : lon);
    if (want <= 1) saveLive(lat, lon, raw);
  }catch{}
  finally{ roadLoading = false; }
}

const REGION_BOX = [[37.8, 39.4, 26.1, 28.4], [37.5, 38.2, 27.2, 28.9], [36.5, 37.6, 27.3, 29.5]];
function regionCells(){
  const seen = new Set(), list = [];
  for (const [a, b, c, d] of REGION_BOX)

      for (let ix = Math.floor(c / CELL); ix <= Math.floor(d / CELL); ix++){
        const k = iy + '_' + ix;
        if (!seen.has(k)){ seen.add(k); list.push([iy, ix]); }
      }
  return list;
}
function cellQuery(iy, ix){
  const box = `${(iy * CELL).toFixed(4)},${(ix * CELL).toFixed(4)},${((iy + 1) * CELL).toFixed(4)},${((ix + 1) * CELL).toFixed(4)}`;
  return `[out:json][timeout:80];(way["highway"~"^(${HW_MAIN})$"](${box});way["railway"="rail"](${box});way["waterway"="river"](${box});way["natural"="coastline"](${box}););out body geom;`;
}
let dlRunning = false, dlCancel = false;

async function storageInfo(){

  const range = zoomMeters * 1.35;

  rctx.save(); rctx.translate(tx, ty); rctx.rotate(-rad); rctx.lineCap = 'round'; rctx.lineJoin = 'round';

  for (const c of [1, 0]){
    const list = buckets[c]; if (!list.length) continue;
    rctx.strokeStyle = c === 0 ? 'rgba(96, 195, 255, 0.22)' : 'rgba(96, 195, 255, 0.12)';
    rctx.lineWidth = (c === 0 ? 7.0 : 4.6) * dp;
    rctx.beginPath();
    for (const way of list){ const pts = way.m; for (let i = 0; i < pts.length; i++){ if (i === 0) rctx.moveTo(X(pts[i]), Y(pts[i])); else rctx.lineTo(X(pts[i]), Y(pts[i])); } }
    rctx.stroke();
  }

  for (const c of DRAW_ORDER){
    const list = buckets[c]; if (!list.length) continue;
    const st = ROAD_STYLE[c];
    rctx.strokeStyle = st[0]; rctx.lineWidth = st[1] * dp;
    if (st[2]) rctx.setLineDash(st[2].map(v => v * dp));
    rctx.beginPath();
    for (const way of list){ const pts = way.m; for (let i = 0; i < pts.length; i++){ if (i === 0) rctx.moveTo(X(pts[i]), Y(pts[i])); else rctx.lineTo(X(pts[i]), Y(pts[i])); } }
    rctx.stroke();
    if (st[2]) rctx.setLineDash([]);
  }

  const drawStyledPath = (Rt) => {
    if (!Rt || Rt.P.length < 2) return;
    const m = MAP_MODES[mapModeIdx].k;
    if (m === 'aurora'){
      const N = 28, tt = Date.now() / 1000;
      rctx.save(); rctx.globalCompositeOperation = 'lighter'; rctx.lineCap = 'round';
      for (let c = 0; c < N; c++){
        rctx.beginPath(); let any = false;
        for (let i = 1; i < Rt.P.length; i++){
          const mid = (Rt.D[i-1] + Rt.D[i]) / 2;
          if (Math.min(N - 1, Math.floor(mid / range * N)) !== c) continue;
          rctx.moveTo(X(Rt.P[i-1]), Y(Rt.P[i-1])); rctx.lineTo(X(Rt.P[i]), Y(Rt.P[i])); any = true;
        }
        if (!any) continue;
        const k = (c + 0.5) / N, al = 1 - 0.8 * k, hu = (190 + k * 140 - tt * 55 + 720) % 360;
        rctx.strokeStyle = `hsla(${hu.toFixed(0)},100%,65%,${(0.35 * al * br).toFixed(3)})`; rctx.lineWidth = 9.5 * dp; rctx.stroke();
        rctx.strokeStyle = `hsla(${hu.toFixed(0)},100%,86%,${(0.96 * al).toFixed(3)})`; rctx.lineWidth = 2.9 * dp; rctx.stroke();
      }
      rctx.restore();
    } else if (m === 'plasma'){
      rctx.save(); rctx.globalCompositeOperation = 'lighter'; rctx.lineCap = 'round';
      rctx.beginPath();
      for (let i = 0; i < Rt.P.length; i++){ if (i === 0) rctx.moveTo(X(Rt.P[i]), Y(Rt.P[i])); else rctx.lineTo(X(Rt.P[i]), Y(Rt.P[i])); }
      rctx.strokeStyle = `rgba(${TH.acc},${(0.35 * br).toFixed(3)})`; rctx.lineWidth = 12 * dp; rctx.stroke();
      rctx.strokeStyle = '#ffffff'; rctx.lineWidth = 2.9 * dp; rctx.stroke();
      rctx.restore();
    } else if (m === 'arrow'){
      rctx.beginPath();
      for (let i = 0; i < Rt.P.length; i++){ if (i === 0) rctx.moveTo(X(Rt.P[i]), Y(Rt.P[i])); else rctx.lineTo(X(Rt.P[i]), Y(Rt.P[i])); }
      rctx.strokeStyle = `rgba(${TH.core}, 0.55)`; rctx.lineWidth = 2.4 * dp; rctx.stroke();
      const SP = 34, ph = (pulsePhase / 90) * SP;
      for (let d = ph; d < Math.min(Rt.len, range); d += SP){
        const p = routePointAt(Rt, d), p2 = routePointAt(Rt, Math.min(Rt.len, d + 4));
        if (!p || !p2) continue;
        let dx2 = X(p2) - X(p), dy2 = Y(p2) - Y(p); const L = Math.hypot(dx2, dy2) || 1; dx2 /= L; dy2 /= L;
        const nx = -dy2, ny = dx2, x = X(p), y = Y(p);
        rctx.beginPath();
        rctx.moveTo(x - dx2 * 4 * dp + nx * 5.5 * dp, y - dy2 * 4 * dp + ny * 5.5 * dp);
        rctx.lineTo(x + dx2 * 4 * dp, y + dy2 * 4 * dp);
        rctx.lineTo(x - dx2 * 4 * dp - nx * 5.5 * dp, y - dy2 * 4 * dp - ny * 5.5 * dp);
        rctx.strokeStyle = '#ffffff'; rctx.lineWidth = 2.0 * dp; rctx.stroke();
      }
    } else {
      rctx.beginPath();
      for (let i = 0; i < Rt.P.length; i++){ if (i === 0) rctx.moveTo(X(Rt.P[i]), Y(Rt.P[i])); else rctx.lineTo(X(Rt.P[i]), Y(Rt.P[i])); }
      rctx.strokeStyle = `rgba(56, 189, 248, ${(0.36 * br).toFixed(3)})`; rctx.lineWidth = 10 * dp; rctx.stroke();
      rctx.strokeStyle = '#e0f7ff'; rctx.lineWidth = 3.0 * dp; rctx.stroke();
    }
  };

  pulsePhase = (pulsePhase + dtD * (12 + fixSpeed * 0.7)) % 90;

  if (navRoute && navRoute.localPts.length >= 2){
    const rPts = navRoute.localPts, sn = navState && navState.snap ? navState.snap : snapToPolyline(ox, oy, rPts, navRoute.cum);
    drawStyledPath(collectRoute(rPts, sn.seg, sn.pt, 1, range * 2));
    if (navState && navState.nextStep && navState.nextStep.xy){
      const nx = X(navState.nextStep.xy), ny = Y(navState.nextStep.xy);
      rctx.fillStyle = 'rgba(56, 189, 248, 0.35)'; rctx.beginPath(); rctx.arc(nx, ny, 9.5 * dp, 0, Math.PI * 2); rctx.fill();
      rctx.fillStyle = '#ffffff'; rctx.beginPath(); rctx.arc(nx, ny, 3.6 * dp, 0, Math.PI * 2); rctx.fill();
    }
    const endPt = rPts[rPts.length - 1], ex = X(endPt), ey = Y(endPt);
    rctx.strokeStyle = '#bae6fd'; rctx.lineWidth = 2 * dp; rctx.beginPath(); rctx.arc(ex, ey, 8.5 * dp * br, 0, Math.PI * 2); rctx.stroke();
    rctx.fillStyle = '#38bdf8'; rctx.beginPath(); rctx.arc(ex, ey, 4 * dp, 0, Math.PI * 2); rctx.fill();
  } else if (matched){
    const pts = matched.m, seg = bestSeg, a = pts[seg], b = pts[seg+1];
    const dx = b[0] - a[0], dy = b[1] - a[1], L2 = dx*dx + dy*dy;
    let tt = L2 > 0 ? ((ox - a[0])*dx + (oy - a[1])*dy) / L2 : 0; tt = Math.max(0, Math.min(1, tt));
    const p0 = [a[0] + tt*dx, a[1] + tt*dy];
    const dir = (dx * Math.sin(targetHeading * Math.PI / 180) + dy * Math.cos(targetHeading * Math.PI / 180)) >= 0 ? 1 : -1;
    drawStyledPath(collectRoute(pts, seg, p0, dir, range));
  }
  rctx.restore();

  if (!fadeCache.gx || fadeCache.w !== w || fadeCache.h !== h){
    const ease = k => k <= 0 ? 0 : k >= 1 ? 1 : 0.5 - 0.5 * Math.cos(Math.PI * k);
    const gx = rctx.createLinearGradient(0, 0, w, 0), gy = rctx.createLinearGradient(0, 0, 0, h);
    for (let i = 0; i <= 32; i++){
      const s = i / 32;
      gx.addColorStop(s, `rgba(0,0,0,${ease(Math.min(s, 1 - s) / 0.16).toFixed(3)})`);
      gy.addColorStop(s, `rgba(0,0,0,${(s < 0.5 ? ease(s / 0.18) : ease((1 - s) / 0.24)).toFixed(3)})`);
    }
    fadeCache = { w, h, gx, gy };
  }
  rctx.save(); rctx.globalCompositeOperation = 'destination-in';
  rctx.fillStyle = fadeCache.gx; rctx.fillRect(0, 0, w, h);
  rctx.fillStyle = fadeCache.gy; rctx.fillRect(0, 0, w, h);
  rctx.restore(); rctx.globalCompositeOperation = 'source-over';

  const glow = rctx.createRadialGradient(tx, ty, 0, tx, ty, 76 * dp);
  glow.addColorStop(0, `rgba(${TH.acc}, ${(0.26 * br).toFixed(3)})`); glow.addColorStop(1, `rgba(${TH.acc}, 0)`);
  rctx.fillStyle = glow; rctx.beginPath(); rctx.arc(tx, ty, 76 * dp, 0, Math.PI * 2); rctx.fill();

  const tapAge = Date.now() - arrowTapAt;
  if (tapAge < 450){
    const k = tapAge / 450;
    rctx.strokeStyle = `rgba(${TH.core}, ${(0.75 * (1 - k)).toFixed(3)})`;
    rctx.lineWidth = 1.8 * dp;
    rctx.beginPath();
    rctx.arc(tx, ty, (14 + k * 24) * dp, 0, Math.PI * 2);
    rctx.stroke();
  }

  rctx.save(); rctx.translate(tx, ty);
  rctx.fillStyle = '#07111e'; rctx.strokeStyle = `rgb(${TH.arrow})`; rctx.lineWidth = 2.0 * dp;
  rctx.beginPath(); rctx.moveTo(0, -11 * dp); rctx.lineTo(8 * dp, 8 * dp); rctx.lineTo(0, 3.8 * dp); rctx.lineTo(-8 * dp, 8 * dp); rctx.closePath();
  rctx.fill(); rctx.stroke(); rctx.restore();
}

setInterval(() => { if (!roadAnimRaf && renderLat !== null && !document.hidden && !restMode) drawRoadMap(); }, 180);

/* ---------- YOL ÖNÜ HAVA UYARISI (30 / 60 / 100 KM) ---------- */
let aheadLast = { t: 0, lat: null, lon: null }, aheadBusy = false, aheadShown = false;
function aheadPoint(lat, lon, bearing, km){
  const b = bearing * Math.PI / 180;
  return [lat + km * Math.cos(b) / 110.54, lon + km * Math.sin(b) / (111.32 * Math.max(0.2, Math.cos(lat * Math.PI / 180)))];
}
function hazardOf(c){
  const code = c.weather_code, temp = c.temperature_2m, gust = c.wind_gusts_10m || 0, pr = c.precipitation || 0;
  const wet = [51,53,55,61,63,65,80,81,82,71,73,75,77,85,86].includes(code);
  if ([95,96,99].includes(code)) return { sev: 5, txt: 'GÖK GÜRÜLTÜLÜ FIRTINA' };
  if ([56,57,66,67].includes(code) || (temp <= 3 && (pr > 0.1 || wet))) return { sev: 5, txt: 'BUZLANMA RİSKİ' };
  if ([71,73,75,77,85,86].includes(code)) return { sev: 4, txt: 'KAR YAĞIŞI' };
  if (gust >= 55) return { sev: 4, txt: 'SERT RÜZGÂR ' + Math.round(gust) + ' KM/SA' };
  if ([45,48].includes(code)) return { sev: 3, txt: 'SİS' };
  if ([65,82].includes(code)) return { sev: 3, txt: 'YOĞUN YAĞMUR' };
  if ([51,53,55,61,63,80,81].includes(code)) return { sev: 2, txt: 'YAĞMUR' };
  return null;
}
function showAhead(b){
  const chip = $('aheadChip');
  if (!b){ aheadShown = false; chip.classList.remove('on'); return; }
  $('aheadText').textContent = `${b.km} KM ÖNDE · ${b.txt}`;
  aheadShown = true; chip.classList.add('on');
}
async function checkAhead(){
  if (aheadBusy || fixLat === null) return;
  const now = Date.now();
  if (fixSpeed < 5 || now - fixTime > 15000) return;
  const moved = aheadLast.lat !== null ? distKm(aheadLast.lat, aheadLast.lon, fixLat, fixLon) : 99;
  if (now - aheadLast.t < 8 * 60000 && moved < 12) return;
  aheadBusy = true; aheadLast = { t: now, lat: fixLat, lon: fixLon };
  try{
    const kms = [30, 60, 100], pts = kms.map(k => aheadPoint(fixLat, fixLon, fixHead, k));
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${pts.map(p => p[0].toFixed(3)).join(',')}&longitude=${pts.map(p => p[1].toFixed(3)).join(',')}&current=temperature_2m,precipitation,weather_code,wind_gusts_10m&timezone=auto`;
    const d = await (await fetch(url)).json();
    const arr = Array.isArray(d) ? d : [d];
    let best = null;
    arr.forEach((o, i) => {
      const c = o && o.current; if (!c) return;
      const h = hazardOf(c);
      if (h && (!best || h.sev > best.sev || (h.sev === best.sev && kms[i] < best.km))) best = { sev: h.sev, txt: h.txt, km: kms[i] };
    });
    showAhead(best);
  }catch{}
  finally{ aheadBusy = false; }
}
setInterval(checkAhead, 30000);
setInterval(() => {
  const now = Date.now();
  if (!restMode && fixTime > 0 && now - fixTime < 30000 && now > restSnoozeUntil && now - lastMoveAt > 180000 && fixSpeed < 1) enterRest();
  if (aheadShown && now - aheadLast.t > 25 * 60000) showAhead(null);
}, 5000);

/* ---------- GPS & PUSULA ---------- */
function distKm(a,b,c,d){
  const R=6371,r=Math.PI/180,dl=(c-a)*r,dn=(d-b)*r;
  const x=Math.sin(dl/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(dn/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
let compassOn = false, gpsHeadTime = 0;
function onOrient(e){
  if (Date.now() - gpsHeadTime < 5000) return;
  let h = typeof e.webkitCompassHeading === 'number' ? e.webkitCompassHeading : (e.absolute && e.alpha != null ? 360 - e.alpha : null);
  if (h == null) return;
  const ang = (screen.orientation && screen.orientation.angle != null) ? screen.orientation.angle : (window.orientation || 0);
  /* Dik tutulan telefonda ekran yatay döndürülmüşse, haritanın "ileri" yönü telefonun yan kenarıdır */
  const lay = (innerHeight > innerWidth && getMode() !== 'off') ? (getMode() === 'cw' ? 90 : -90) : 0;
  targetHeading = (h + ang + lay + 720) % 360;
  kickRoadAnim();
}
function startCompass(){
  if (compassOn) return; compassOn = true;
  const D = window.DeviceOrientationEvent;
  if (D && typeof D.requestPermission === 'function'){
    D.requestPermission().then(r => { if (r === 'granted') window.addEventListener('deviceorientation', onOrient, true); else compassOn = false; }).catch(() => { compassOn = false; });
  } else {
    window.addEventListener('deviceorientationabsolute', onOrient, true);
    window.addEventListener('deviceorientation', onOrient, true);
  }
}
document.addEventListener('click', startCompass, { once: true });

const KM_TH = 2.5, T_TH = 3 * 60 * 1000;
let lastGeoLat = null, lastGeoLon = null, lastGeoAt = 0, geoTryAt = 0;
/* Şehir adı: sadece başarılı istekte "güncel" sayılır, başarısızsa 15 sn sonra tekrar dener */
async function updatePlaceSignature(lat, lon, force=false){
  const now = Date.now(), moved = lastGeoLat !== null ? distKm(lastGeoLat, lastGeoLon, lat, lon) : 99;
  if (!force && lastGeoLat !== null && moved < KM_TH && now - lastGeoAt < T_TH) return;
  if (!force && now - geoTryAt < 15000) return;
  geoTryAt = now;
  try{
    const d = await (await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=tr`)).json();
    const loc = (d.locality || d.city || '').toUpperCase(), prov = (d.principalSubdivision || '').toUpperCase(), country = (d.countryName || 'TÜRKİYE').toUpperCase();
    if (!loc && !prov) return;
    if (loc && prov && loc !== prov){ $('sigCity').textContent = loc; $('sigSub').textContent = `${prov} · ${country}`; }
    else { $('sigCity').textContent = prov || loc || 'KONUM'; $('sigSub').textContent = country; }
    lastGeoLat = lat; lastGeoLon = lon; lastGeoAt = Date.now();
  }catch{}
}
function updateGeo(c){
  if (c.speed > 1.5 && c.heading != null && isFinite(c.heading)){ gpsHeadTime = Date.now(); targetHeading = c.heading; }
  fixSpeed = (c.speed != null && isFinite(c.speed) && c.speed > 0) ? c.speed : 0;
  fixHead = (c.speed > 1.5 && c.heading != null && isFinite(c.heading)) ? c.heading : targetHeading;
  fixLat = c.latitude; fixLon = c.longitude; fixTime = Date.now();
  if (!restRef) restRef = { lat: c.latitude, lon: c.longitude };
  if (fixSpeed > 1.5 || distKm(restRef.lat, restRef.lon, c.latitude, c.longitude) > 0.06){
    lastMoveAt = Date.now(); restRef = { lat: c.latitude, lon: c.longitude };
    if (restMode) exitRest(false);
  }
  if (autoZoom) targetZoomMeters = computeAutoZoomMeters(fixSpeed, lastDistToTurn);
  updateSlope(c.latitude, c.longitude, c.altitude);
  if (fixSpeed >= 5) checkAhead();
  fxKick();
  targetLat = c.latitude; targetLon = c.longitude;
  fetchRoadNetwork(targetLat, targetLon, false);
  fetchTempOnly(c.latitude, c.longitude, false);
  updatePlaceSignature(c.latitude, c.longitude, false);
  kickRoadAnim();
}
function startGps(){
  setTimeout(() => { if (targetLat === null) ipFallback(); }, 4000);
  if (!('geolocation' in navigator)) return ipFallback();
  navigator.geolocation.watchPosition(p => updateGeo(p.coords), () => { if (targetLat === null) ipFallback(); }, { enableHighAccuracy: true, maximumAge: 3000, timeout: 10000 });
  setInterval(() => navigator.geolocation.getCurrentPosition(p => updateGeo(p.coords), () => {}, { enableHighAccuracy: true, timeout: 8000 }), T_TH);
}
async function ipFallback(){
  if (targetLat !== null) return;
  try{
    const d = await (await fetch('https://ipwho.is/')).json();
    if (targetLat !== null) return;
    if (d && d.latitude){
      targetLat = renderLat = d.latitude; targetLon = renderLon = d.longitude;
      $('sigCity').textContent = (d.city || 'MUĞLA').toUpperCase(); $('sigSub').textContent = (d.country || 'TÜRKİYE').toUpperCase();
      fetchRoadNetwork(targetLat, targetLon, true); fetchTempOnly(targetLat, targetLon, true);
      drawRoadMap(); drawTopCompass(); return;
    }
  }catch{}
  if (targetLat !== null) return;
  targetLat = renderLat = 37.2153; targetLon = renderLon = 28.3636;
  $('sigCity').textContent = 'MUĞLA'; $('sigSub').textContent = 'TÜRKİYE';
  fetchRoadNetwork(targetLat, targetLon, true); fetchTempOnly(targetLat, targetLon, true);
  drawRoadMap(); drawTopCompass();
}

/* ---------- DİK TELEFON → YATAY EKRAN ---------- */
const scr = $('screen'), modes = ['cw', 'ccw', 'off'], modeNames = { cw: 'Ekran yönü: sağa', ccw: 'Ekran yönü: sola', off: 'Döndürme kapalı' };
function getMode(){ try{ return localStorage.getItem('rot') || 'cw'; }catch{ return 'cw'; } }
function toggleRotMode(){
  const m = modes[(modes.indexOf(getMode()) + 1) % modes.length];
  try{ localStorage.setItem('rot', m); }catch{}
  applyLayout(); toast(modeNames[m]);
}
function applyLayout(){
  const W = Math.round(innerWidth), H = Math.round(innerHeight), mode = getMode(); let w = W, h = H;
  if (H > W && mode !== 'off'){
    w = H; h = W;
    scr.style.cssText = `position:fixed;left:0;top:0;width:${w}px;height:${h}px;transform-origin:0 0;` +
      `transform:${mode === 'cw' ? `translate3d(${W}px,0,0) rotate(90deg)` : `translate3d(0,${H}px,0) rotate(-90deg)`}`;
    document.documentElement.style.setProperty('--px', Math.round(w * .032) + 'px');
  } else {
    scr.style.cssText = '';
    document.documentElement.style.removeProperty('--px');
  }
  document.documentElement.style.setProperty('--vh', h / 100 + 'px');
  document.documentElement.style.setProperty('--vw', w / 100 + 'px');
  roadSize();
}

addEventListener('resize', applyLayout);
addEventListener('orientationchange', () => setTimeout(applyLayout, 150));
if (typeof ResizeObserver !== 'undefined'){
  let roRaf = 0;
  const ro = new ResizeObserver(() => { if (roRaf) return; roRaf = requestAnimationFrame(() => { roRaf = 0; roadSize(); }); });
  ro.observe(roadCv);
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden){ lastStepTs = 0; kickRoadAnim(); drawRoadMap(); drawTopCompass(); eqKick(); fxKick(); tickClock(); }
});

/* ---------- BAŞLANGIÇ ---------- */
tickClock();
setInterval(tickClock, 1000);
setInterval(() => { if (themeKey === 'auto') setTheme('auto', false, false); }, 60000);
renderStation();
setTheme(themeKey, false, true);
applyLayout();
eqKick();
startGps();
</script>
